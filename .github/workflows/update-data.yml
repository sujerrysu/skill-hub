name: Update Skills Data

on:
  schedule:
    # 每天北京时间凌晨 2:00 运行 (UTC 18:00 前一天)
    - cron: '0 18 * * *'
  workflow_dispatch: # 允许手动触发
  push:
    branches: [main]
    paths:
      - 'scripts/crawler.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run crawler
      
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "🤖 Auto update skills data - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
